# What meshterm.net links to. Edit this, then run build.py (see README.md).
#
# Every link takes a label, a url, and optionally a note (a line under the label) and a
# color — the neon it glows in, as #rrggbb. A button wears its destination's own brand
# colour, so a visitor knows where it goes before reading it; where a brand has several,
# pick the one that reads on black (PayPal's light blue, not its navy; GitHub's white).

[site]
url = "https://meshterm.net"
title = "MeshTerm — a full-featured TUI MeshCore client for your terminal"
description = "MeshTerm is a full-featured TUI MeshCore client for your terminal. Connect your device over USB, Bluetooth, or TCP. For Windows, macOS, and Linux. Free and open-source."

# Behaviour analytics, beside the Cloudflare page counts every page already carries. It
# is left out of the pages while its key is empty.
#   posthog_key: the project API key (phc_…) from PostHog → Project settings (events and
#     funnels; session recording is switched off in the page). posthog_host is the region
#     the project lives in: us or eu.

[analytics]
posthog_key = "phc_tWNACwAassEExnLRUTnT9empuH7v7WGSg9go5oXckX2D"
posthog_host = "https://us.i.posthog.com"

# The big buttons under the splash. `nav = true` also puts one in the top bar and the
# footer. Clicks reach PostHog named by the label as a slug (`buy-me-a-coffee`); set
# `track = "old-name"` on a link before relabelling it, so its charts keep counting.

[[primary]]
label = "GitHub"
url = "https://github.com/jpmartineau/MeshTerm"
note = "Source, releases, and issues."
color = "#f0f6fc"
nav = true

[[primary]]
label = "Discord"
url = "https://discord.gg/AZwe5Uvb3S"
note = "Questions, ideas, bug reports, and mesh talk."
color = "#5865f2"
nav = true

[[primary]]
label = "Reddit"
url = "https://www.reddit.com/r/MeshTerm/"
note = "News, screenshots, and show-and-tell."
color = "#ff4500"
nav = true

# The landing page's Support section. The Support page itself is support.md in MeshTerm.

[[donate]]
label = "Buy me a coffee"
url = "https://buymeacoffee.com/johnputer"
color = "#ffdd00"

[[donate]]
label = "PayPal"
url = "https://www.paypal.com/donate/?hosted_button_id=5RATNEJP2K5U6"
color = "#009cde"

[[donate]]
label = "Patreon"
url = "https://www.patreon.com/cw/MeshTerm"
color = "#ff424d"

# Small print after the copyright line, at the foot of every page. The code signing policy
# lives in MeshTerm's README, beside the downloads it covers, and SignPath Foundation (who
# sign the Windows build) ask for it to be reachable from the homepage too.

[[fine_print]]
label = "Code signing policy"
url = "https://github.com/jpmartineau/MeshTerm#code-signing-policy"

# The demo recording, shown under the buttons. MeshTerm's scripts/video.py makes all three
# files from its demo mesh and writes them into src/, and they are copied out verbatim: the
# mp4 is already H.264 in yuv420p with its moov box in front, which is what lets a browser
# start playing it before the whole file has arrived. The poster is a frame of the video
# itself, so the page shows the real thing before anyone presses play.

[demo]
file = "demo.mp4"
poster = "demo-poster.png"
# The same frame with a play mark and the running time burned in. The page never
# shows it: it is for a page that cannot play the video and has to link to it instead,
# as MeshTerm's README once did, so there the demo is a picture that announces itself
# as one.
card = "demo-play.png"
title = "Watch it"
caption = "Under two minutes in the demo mesh over Montréal: every path one channel message took to arrive, a reply to a message as it comes in, a trace across the river and back, the map, a repeater administered over the air, and a packet read out of the live feed."

# The screens on the landing page, taken from MeshTerm's docs/screenshots/. The captures
# come in sets: the same screens on the desktop and on each handheld, one tab each, and the
# page opens on the first set. Each set is a folder of docs/screenshots/, which MeshTerm's
# scripts/screenshots.py writes from its demo mesh, and every capture below has one image
# in each folder. A capture keeps its pixels and stays a PNG.
#
# An entry marked `device = true` is a photo of the hardware: it leaves as a JPEG and
# goes in the column beside the captures, outside the sets. A device entry that is a
# capture of the handheld's own display, not a photo, adds `capture = true`: it shares
# that column but keeps its pixels as a PNG.

[[screen_set]]
dir = "terminal"
label = "Terminal"

[[screen_set]]
dir = "cardputer-zero"
label = "Cardputer Zero"

[[screen_set]]
dir = "picocalc-lyra"
label = "PicoCalc"

[[screen]]
file = "menu.png"
title = "Main menu"
caption = "Every tool in one menu: chat, watch the mesh, explore it, and set up your node."

[[screen]]
file = "chat.png"
title = "Chat"
caption = "Talk on channels, in rooms, and one to one, with every sender in a colour of their own."

[[screen]]
file = "paths.png"
title = "Message paths"
caption = "Visualize every path a message took to reach you."

[[screen]]
file = "map.png"
title = "Map"
caption = "Explore the nodes around you on the map."

