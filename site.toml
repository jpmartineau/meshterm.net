# What meshterm.net links to. Edit this, then run build.py (see README.md).
#
# Every link takes a label, a url, and optionally a note (a line under the label) and a
# color — the neon it glows in, as #rrggbb. A button wears its destination's own brand
# colour, so a visitor knows where it goes before reading it; where a brand has several,
# pick the one that reads on black (PayPal's light blue, not its navy; GitHub's white).

[site]
url = "https://meshterm.net"
title = "MeshTerm — a MeshCore client for your terminal"
description = "MeshTerm is a full-featured MeshCore client that lives in your terminal. Connect your device over USB, Bluetooth, or TCP. For Windows, macOS, and Linux. Free and open-source."

# Behaviour analytics, beside the Cloudflare page counts every page already carries. It
# is left out of the pages while its key is empty.
#   posthog_key: the project API key (phc_…) from PostHog → Project settings (events,
#     funnels, recordings). posthog_host is the region the project lives in: us or eu.

[analytics]
posthog_key = "phc_tWNACwAassEExnLRUTnT9empuH7v7WGSg9go5oXckX2D"
posthog_host = "https://us.i.posthog.com"

# The big buttons under the splash. `nav = true` also puts one in the top bar and the
# footer. Clicks reach PostHog named by the label as a slug (`buy-me-a-coffee`); set
# `track = "old-name"` on a link before relabelling it, so its charts keep counting.

[[primary]]
label = "GitHub"
url = "https://github.com/jpmartineau/MeshTerm"
note = "Source, releases, and issues."
color = "#f0f6fc"
nav = true
# `opens` marks a link that isn't public yet. Every build asks the url: while it answers
# a logged-out visitor with 404, the button shows "Opens <opens>" and links nowhere, the
# top bar and footer leave it out, and the pages spell the address out unlinked. The
# first build after the repo goes public links it everywhere; delete this line after.
opens = "22 September"

[[primary]]
label = "Discord"
url = "https://discord.gg/AZwe5Uvb3S"
note = "Questions, ideas, bug reports, and mesh talk."
color = "#5865f2"
nav = true

[[primary]]
label = "Reddit"
url = "https://www.reddit.com/r/MeshTerm/"
note = "News, screenshots, and show-and-tell."
color = "#ff4500"
nav = true

# The landing page's Support section. The Support page itself is support.md in MeshTerm.

[[donate]]
label = "Buy me a coffee"
url = "https://buymeacoffee.com/johnputer"
color = "#ffdd00"

[[donate]]
label = "PayPal"
url = "https://www.paypal.com/donate/?hosted_button_id=5RATNEJP2K5U6"
color = "#009cde"

[[donate]]
label = "Patreon"
url = "https://www.patreon.com/cw/MeshTerm"
color = "#ff424d"

# The demo recording, shown under the buttons. Both files live in src/ and are copied
# out verbatim: the mp4 is already H.264 in yuv420p with its moov box in front, which is
# what lets a browser start playing it before the whole file has arrived. The poster is a
# still from the video itself, so the page shows the real thing before anyone presses play.

[demo]
file = "demo.mp4"
poster = "demo-poster.png"
# The same frame with a play mark and the running time burned in. The page never
# shows it: it is what MeshTerm's README links, because GitHub will not play an mp4
# that is not one of its own attachments, so there the demo has to be a picture that
# announces itself as one.
card = "demo-play.png"
title = "Watch it"
caption = "Under two minutes on a real mesh: pairing over Bluetooth, then every route one channel message took to arrive, a trace out and back across the city, a repeater administered over the air, and a packet read out of the live feed."

# The screens on the landing page, in order, taken from MeshTerm's docs/screenshots/ (the
# files the README shows). A terminal capture keeps its pixels and stays a PNG; one marked
# `device = true` is a photo of the hardware, which leaves as a JPEG and takes the tall
# slot beside the captures.

[[screen]]
file = "dashboard.png"
title = "Dashboard"
caption = "See how busy the mesh is, minute by minute."

[[screen]]
file = "map.png"
title = "Map"
caption = "Explore the nodes around you on the map."

[[screen]]
file = "trace.png"
title = "Trace"
caption = "Trace a route hop by hop and see the signal strength at every step."

[[screen]]
file = "path.png"
title = "Message paths"
caption = "Visualize every path a message took to reach you."

[[screen]]
file = "picocalc.png"
title = "PicoCalc"
caption = "A DIY mesh terminal. MeshTerm running on a PicoCalc with a radio wired in."
device = true

